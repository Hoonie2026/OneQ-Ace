<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1420; }
      .title { fill: #f1f5f9; font-size: 20px; font-weight: 800; }
      .sub { fill: #94a3b8; font-size: 13px; font-weight: 500; }
      .col-title-bad { fill: #ff7a7a; font-size: 15px; font-weight: 800; }
      .col-title-good { fill: #4cc98a; font-size: 15px; font-weight: 800; }
      .caption { fill: #94a3b8; font-size: 12px; }
    </style>
  </defs>

  <rect width="960" height="720" class="bg" />

  <text x="40" y="42" class="title">실기기 캡처 핵심 화면 레이아웃 · 카드 · 타이포그래피 개선 비교</text>
  <text x="40" y="65" class="sub">중첩 테두리(박스 안의 박스) 제거 · 고아 음절(문/항, 추/가) 줄바꿈 해결 · 수험표 시선 집중도 개선</text>

  <!-- ================= SECTION 1: EXAM TICKET & TODAY CARD ================= -->
  <text x="40" y="102" class="col-title-bad">❌ 현재 실기기 (캡처 8번·9번: 테두리 과잉·노란색 시선 분산)</text>
  <text x="505" y="102" class="col-title-good">✅ 상용 앱 수준 개선안 (면 계층 분리·단추 칩화·단일 강조)</text>

  <!-- Left: Current Ticket + Today Card -->
  <g transform="translate(40, 116)">
    <!-- Ticket Card (Current) -->
    <rect x="0" y="0" width="415" height="96" rx="18" fill="#16273d" />
    <text x="18" y="26" fill="#b8c4d4" font-size="13">시험일 · 2027년</text>
    <text x="18" y="54" fill="#ffffff" font-size="21" font-weight="800">4월 1일 (목)</text>
    <text x="18" y="79" fill="#f2b830" font-size="15" font-weight="800" text-decoration="underline">학습계획 설정(재설정)</text>
    <line x1="280" y1="10" x2="280" y2="86" stroke="#5c708a" stroke-width="2" stroke-dasharray="4 4" />
    <text x="395" y="34" text-anchor="end" fill="#b8c4d4" font-size="13">오늘 기준</text>
    <text x="395" y="68" text-anchor="end" fill="#f2b830" font-size="28" font-weight="800">D-164</text>

    <!-- Today Card (Current: double blue borders + inner outlined button) -->
    <rect x="0" y="110" width="415" height="205" rx="16" fill="#142235" stroke="#5b93ff" stroke-width="2" />
    <text x="18" y="140" fill="#e9eef5" font-size="18" font-weight="700">오늘 학습 목표</text>
    <text x="397" y="140" text-anchor="end" fill="#e9eef5" font-size="15" font-weight="700">30분 · 20문항</text>
    <rect x="18" y="154" width="379" height="8" rx="4" fill="#5b93ff" />
    <text x="18" y="180" fill="#9aabc0" font-size="13">오늘 20 / 20문항 완료</text>
    <rect x="18" y="194" width="379" height="48" rx="12" fill="#5b93ff" />
    <text x="207" y="224" text-anchor="middle" fill="#08111d" font-size="16" font-weight="700">시스템 추천 학습 ›</text>
    <rect x="18" y="250" width="379" height="44" rx="12" fill="#142235" stroke="#26384f" stroke-width="1.5" />
    <text x="207" y="278" text-anchor="middle" fill="#e9eef5" font-size="15" font-weight="600">과목별 학습 ›</text>
  </g>

  <!-- Right: Improved Ticket + Today Card -->
  <g transform="translate(505, 116)">
    <!-- Ticket Card (Improved: subtle punch notches, pill button, single gold accent on D-164) -->
    <rect x="0" y="0" width="415" height="96" rx="18" fill="#172a45" />
    <circle cx="285" cy="0" r="7" fill="#0b1420" />
    <circle cx="285" cy="96" r="7" fill="#0b1420" />
    <line x1="285" y1="12" x2="285" y2="84" stroke="#2c4466" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="20" y="25" fill="#94a3b8" font-size="12" font-weight="600">2027년 시험일</text>
    <text x="20" y="52" fill="#f8fafc" font-size="21" font-weight="800">4월 1일 (목)</text>
    <rect x="20" y="62" width="136" height="24" rx="12" fill="#233b5e" />
    <text x="88" y="78" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">학습계획 설정 · 변경</text>
    <text x="395" y="34" text-anchor="end" fill="#94a3b8" font-size="12" font-weight="600">남은 기간</text>
    <text x="395" y="68" text-anchor="end" fill="#f2b830" font-size="28" font-weight="800">D-164</text>

    <!-- Today Card (Improved: borderless tonal surface, clean hierarchy) -->
    <rect x="0" y="110" width="415" height="205" rx="18" fill="#152234" />
    <text x="20" y="140" fill="#f1f5f9" font-size="18" font-weight="800">오늘 학습 목표</text>
    <rect x="303" y="123" width="92" height="24" rx="8" fill="#1e324d" />
    <text x="349" y="139" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">30분 · 20문항</text>
    <rect x="20" y="156" width="375" height="8" rx="4" fill="#3b82f6" />
    <text x="20" y="180" fill="#94a3b8" font-size="13" font-weight="500">오늘 20 / 20문항 완료</text>
    <rect x="20" y="194" width="375" height="50" rx="14" fill="#3b82f6" />
    <text x="207" y="225" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">시스템 추천 학습</text>
    <rect x="20" y="252" width="375" height="46" rx="14" fill="#1e2f47" />
    <text x="207" y="280" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">과목별 학습</text>
  </g>

  <!-- ================= SECTION 2: TYPOGRAPHY WRAPPING & FORM BUGS ================= -->
  <text x="40" y="468" class="col-title-bad">❌ 현재 실기기 줄바꿈 깨짐 (캡처 4번 '문/항', 캡처 9번 '추/가')</text>
  <text x="505" y="468" class="col-title-good">✅ 상용 앱 수준 타이포그래피 조판 (어절 유지 · 상하 배치 · 고정폭)</text>

  <!-- Left: Broken Wrapping Examples -->
  <g transform="translate(40, 482)">
    <!-- Broken Recommend Header -->
    <rect x="0" y="0" width="415" height="96" rx="16" fill="#142235" stroke="#26384f" stroke-width="1" />
    <text x="18" y="32" fill="#e9eef5" font-size="18" font-weight="800">오늘 추천 20문</text>
    <text x="18" y="56" fill="#e9eef5" font-size="18" font-weight="800">항</text>
    <text x="155" y="32" fill="#9aabc0" font-size="14">오늘 목표 30분 · 20문항 중 남은 분</text>
    <text x="155" y="54" fill="#9aabc0" font-size="14">량</text>
    <text x="18" y="82" fill="#ff7a7a" font-size="12">▲ 좌우 배치 + 글자 단위 줄바꿈으로 '항', '량' 외톨이 글자 발생</text>

    <!-- Broken '추가' Button in PlanSetup -->
    <rect x="0" y="110" width="415" height="96" rx="16" fill="#142235" stroke="#26384f" stroke-width="1" />
    <rect x="18" y="124" width="182" height="52" rx="10" fill="#0b1420" stroke="#26384f" stroke-width="1" />
    <text x="32" y="156" fill="#e9eef5" font-size="15">2026. 10. 19.</text>
    <rect x="208" y="124" width="128" height="52" rx="10" fill="#0b1420" stroke="#26384f" stroke-width="1" />
    <text x="222" y="156" fill="#e9eef5" font-size="15">3시간</text>
    <rect x="344" y="124" width="53" height="52" rx="10" fill="#142235" stroke="#26384f" stroke-width="1" />
    <text x="370" y="145" text-anchor="middle" fill="#e9eef5" font-size="15" font-weight="700">추</text>
    <text x="370" y="165" text-anchor="middle" fill="#e9eef5" font-size="15" font-weight="700">가</text>
    <text x="18" y="194" fill="#ff7a7a" font-size="12">▲ 실기기 캡처 9번: '추가' 단추가 폭이 눌려 세로 두 줄(추/가)로 깨짐</text>
  </g>

  <!-- Right: Fixed Commercial Layout -->
  <g transform="translate(505, 482)">
    <!-- Clean Stacked Recommend Header -->
    <rect x="0" y="0" width="415" height="96" rx="16" fill="#152234" />
    <text x="20" y="34" fill="#f1f5f9" font-size="20" font-weight="800">오늘 추천 20문항</text>
    <text x="20" y="58" fill="#94a3b8" font-size="14" font-weight="500">오늘 목표 30분(20문항) 중 남은 분량입니다</text>
    <text x="20" y="82" fill="#4cc98a" font-size="12">▲ 제목과 부제목을 상하(Stack)로 분리하고 어절 단위(keep-all) 유지</text>

    <!-- Clean '추가' Row in PlanSetup -->
    <rect x="0" y="110" width="415" height="96" rx="16" fill="#152234" />
    <rect x="20" y="124" width="168" height="48" rx="10" fill="#1e2f47" />
    <text x="34" y="154" fill="#f1f5f9" font-size="15" font-weight="600">2026. 10. 19.</text>
    <rect x="196" y="124" width="122" height="48" rx="10" fill="#1e2f47" />
    <text x="210" y="154" fill="#f1f5f9" font-size="15" font-weight="600">3시간</text>
    <rect x="326" y="124" width="69" height="48" rx="10" fill="#2563eb" />
    <text x="360" y="154" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">+ 추가</text>
    <text x="20" y="194" fill="#4cc98a" font-size="12">▲ white-space: nowrap 및 최소 폭(68px) 보장으로 줄바꿈 원천 차단</text>
  </g>
</svg>
