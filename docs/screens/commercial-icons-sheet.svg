<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <style>
      .bg { fill: #0b1420; }
      .panel-bad { fill: #162234; stroke: #3b2329; stroke-width: 1.5; rx: 16px; }
      .panel-good { fill: #132238; stroke: #254b85; stroke-width: 1.5; rx: 16px; }
      .title { fill: #f1f5f9; font-size: 20px; font-weight: 800; }
      .sub { fill: #94a3b8; font-size: 13px; font-weight: 500; }
      .badge-bad { fill: #3a1717; stroke: #ff7a7a; stroke-width: 1; rx: 6px; }
      .badge-bad-txt { fill: #ff7a7a; font-size: 12px; font-weight: 700; }
      .badge-good { fill: #12321f; stroke: #4cc98a; stroke-width: 1; rx: 6px; }
      .badge-good-txt { fill: #4cc98a; font-size: 12px; font-weight: 700; }
      .row-label { fill: #cbd5e1; font-size: 14px; font-weight: 700; }
      .row-desc { fill: #8fa0b5; font-size: 12px; }
      .icon-box-bad { fill: #0f1a2a; stroke: #26384f; stroke-width: 1; rx: 12px; }
      .icon-box-good { fill: #192b44; rx: 12px; }
      .divider { stroke: #1e2f45; stroke-width: 1; }
    </style>
  </defs>

  <rect width="960" height="680" class="bg" />

  <!-- Header -->
  <text x="40" y="44" class="title">원큐합격 아이콘 및 기호 시각 개선 비교표 (실기기 캡처 vs 상용 앱 표준)</text>
  <text x="40" y="68" class="sub">24×24px 광학 그리드 · 1.75~2px 균일 스트로크 · 베지어 곡선 마감 (Lucide / Toss TDS 기준)</text>

  <!-- Left Column: Current (v0.8.5 / v0.9.0 Issues) -->
  <rect x="40" y="90" width="425" height="550" class="panel-bad" />
  <rect x="64" y="112" width="170" height="26" class="badge-bad" />
  <text x="149" y="129" text-anchor="middle" class="badge-bad-txt">현재 실기기 캡처 (개선 전)</text>

  <!-- Right Column: Proposed Commercial Grade -->
  <rect x="495" y="90" width="425" height="550" class="panel-good" />
  <rect x="519" y="112" width="190" height="26" class="badge-good" />
  <text x="614" y="129" text-anchor="middle" class="badge-good-txt">상용 앱 수준 개선안 (Lucide 규격)</text>

  <!-- ROW 1: Settings Icon -->
  <g transform="translate(0, 160)">
    <rect x="64" y="0" width="52" height="52" class="icon-box-bad" />
    <!-- Current v0.9.0 sliders icon (misleading as filter) -->
    <g transform="translate(78, 14)" stroke="#e9eef5" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4" />
    </g>
    <text x="132" y="22" class="row-label">1. 설정 아이콘 (슬라이더/이모지 ⚙)</text>
    <text x="132" y="42" class="row-desc">슬라이더는 '검색 필터' 의미 / 유니코드 ⚙는 톱니가 뭉개짐</text>

    <rect x="519" y="0" width="52" height="52" class="icon-box-good" />
    <!-- Commercial Lucide Settings Cog -->
    <g transform="translate(533, 14)" stroke="#e9eef5" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
      <circle cx="12" cy="12" r="3" />
    </g>
    <text x="587" y="22" class="row-label">정밀 기어 아이콘 + 소프트 서피스 버튼</text>
    <text x="587" y="42" class="row-desc">베지어 곡선 기어 + 40×40px 반투명 원형/스쿼클 배경</text>
  </g>

  <line x1="64" y1="232" x2="440" y2="232" class="divider" />
  <line x1="519" y1="232" x2="895" y2="232" class="divider" />

  <!-- ROW 2: Score / Chart Button -->
  <g transform="translate(0, 250)">
    <rect x="64" y="4" width="92" height="42" rx="21" fill="none" stroke="#5b93ff" stroke-width="1.5" />
    <!-- Current v0.9.0 trident-like chart -->
    <g transform="translate(76, 15)" stroke="#5b93ff" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M5 20V11M12 20V5M19 20v-7M3 20h18" transform="scale(0.85)" />
    </g>
    <text x="104" y="30" fill="#5b93ff" font-size="15" font-weight="700">성적</text>
    <text x="172" y="22" class="row-label">2. 성적 버튼 (📊 이모지 / 삼지창 선)</text>
    <text x="172" y="42" class="row-desc">단순 세로선 3개 + 밑줄이 한자 '山'처럼 보임</text>

    <!-- Commercial Pill Button -->
    <rect x="519" y="4" width="96" height="42" rx="12" fill="#1b3152" />
    <g transform="translate(533, 15)" fill="#6ea2ff">
      <rect x="2" y="9" width="4" height="9" rx="1.5" />
      <rect x="8" y="3" width="4" height="15" rx="1.5" />
      <rect x="14" y="6" width="4" height="12" rx="1.5" />
    </g>
    <text x="561" y="30" fill="#e9eef5" font-size="15" font-weight="700">성적</text>
    <text x="631" y="22" class="row-label">면(Filled) 막대 차트 + 톤온톤 칩</text>
    <text x="631" y="42" class="row-desc">외곽선 대신 부드러운 면 배경(#1b3152)과 둥근 막대</text>
  </g>

  <line x1="64" y1="322" x2="440" y2="322" class="divider" />
  <line x1="519" y1="322" x2="895" y2="322" class="divider" />

  <!-- ROW 3: Choice Buttons (1, 2, 3, 4) -->
  <g transform="translate(0, 340)">
    <rect x="64" y="0" width="76" height="54" rx="14" fill="#0b1420" stroke="#26384f" stroke-width="2" />
    <text x="102" y="36" text-anchor="middle" fill="#e9eef5" font-size="26" font-weight="700">①</text>
    <text x="156" y="22" class="row-label">3. 보기 단추 유니코드 원문자 (①②③④)</text>
    <text x="156" y="42" class="row-desc">사각 박스 안에 또 원문자가 들어가 선이 뭉개지고 답답함</text>

    <rect x="519" y="0" width="76" height="54" rx="14" fill="#192940" stroke="#2c4263" stroke-width="1.5" />
    <text x="557" y="35" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="800">1</text>
    <text x="611" y="22" class="row-label">독립 숫자 타이포그래피 (1 · 2 · 3 · 4)</text>
    <text x="611" y="42" class="row-desc">원문자 테두리를 제거하고 또렷한 Pretendard 21px 숫자만 배치</text>
  </g>

  <line x1="64" y1="414" x2="440" y2="414" class="divider" />
  <line x1="519" y1="414" x2="895" y2="414" class="divider" />

  <!-- ROW 4: Arrows & Disclosure Icons -->
  <g transform="translate(0, 432)">
    <rect x="64" y="0" width="110" height="48" rx="12" fill="#0f1a2a" stroke="#26384f" stroke-width="1" />
    <text x="80" y="29" fill="#e9eef5" font-size="16" font-weight="700">☞</text>
    <text x="112" y="29" fill="#5b93ff" font-size="16" font-weight="700">▾</text>
    <text x="142" y="29" fill="#9aabc0" font-size="16" font-weight="700">›</text>
    <text x="190" y="20" class="row-label">4. 화살표 기호의 파편화 (☞ / ▾ / ← / ›)</text>
    <text x="190" y="40" class="row-desc">화면마다 텍스트 기호·손가락·삼각형이 섞여 일관성 붕괴</text>

    <rect x="519" y="0" width="110" height="48" rx="12" fill="#192b44" />
    <g transform="translate(534, 14)" stroke="#6ea2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M5 10h10M11 6l4 4-4 4" />
    </g>
    <g transform="translate(566, 14)" stroke="#6ea2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M5 8l5 5 5-5" />
    </g>
    <g transform="translate(596, 14)" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M8 5l5 5-5 5" />
    </g>
    <text x="645" y="20" class="row-label">단일 Chevron / Arrow SVG 패밀리</text>
    <text x="645" y="40" class="row-desc">동일한 선 굵기(2px)와 90° 각도를 가진 SVG 셰브론으로 통일</text>
  </g>

  <line x1="64" y1="500" x2="440" y2="500" class="divider" />
  <line x1="519" y1="500" x2="895" y2="500" class="divider" />

  <!-- ROW 5: Unknown & Web Search Bottom Row -->
  <g transform="translate(0, 520)">
    <rect x="64" y="0" width="165" height="48" rx="12" fill="none" stroke="#ffbe5c" stroke-width="1.5" />
    <text x="146" y="30" text-anchor="middle" fill="#ffbe5c" font-size="16" font-weight="700">모름</text>
    <rect x="239" y="0" width="165" height="48" rx="12" fill="none" stroke="#5b93ff" stroke-width="1.5" />
    <text x="321" y="30" text-anchor="middle" fill="#5b93ff" font-size="16" font-weight="700">🔎 웹검색</text>
    <text x="64" y="72" class="row-desc">▲ 노란색 테두리와 파란색 테두리가 나란히 충돌하여 산만함 (실기기 캡처 5·12번)</text>

    <rect x="519" y="0" width="165" height="48" rx="12" fill="#1a283d" />
    <text x="601" y="30" text-anchor="middle" fill="#cbd5e1" font-size="16" font-weight="600">모름 (넘기기)</text>
    <rect x="694" y="0" width="165" height="48" rx="12" fill="#172c4c" />
    <g transform="translate(734, 15)" stroke="#6ea2ff" stroke-width="2" stroke-linecap="round" fill="none">
      <circle cx="8" cy="8" r="5.5" />
      <path d="M16 16l-3.5-3.5" />
    </g>
    <text x="792" y="30" text-anchor="middle" fill="#6ea2ff" font-size="16" font-weight="700">AI 개념검색</text>
    <text x="519" y="72" class="row-desc">▲ 외곽선(Border)을 제거하고 차분한 면(Tonal Surface) 버튼으로 통일해 시각적 소음 제거</text>
  </g>
</svg>
